        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        DEVELOPMENT_TEAM: 7GU925RQ99
        PRODUCT_BUNDLE_IDENTIFIER: io.tmkch.yohaku
        YOHAKU_SITE_BASE_URL: https://yohaku.tmkch.io/
        YOHAKU_APP_STORE_ID: ""
      configs:
        Debug:
          # Google's official iOS test IDs. Never requests the live unit while developing.
          ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
          ADMOB_BANNER_AD_UNIT_ID: ca-app-pub-3940256099942544/2435281174
        Release:
          ADMOB_APP_ID: ca-app-pub-8687520805381056~6166567024
          ADMOB_BANNER_AD_UNIT_ID: ca-app-pub-8687520805381056/6272975863
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
    preBuildScripts:
      - path: Scripts/validate-admob-release.sh
        name: Validate Release AdMob configuration
        basedOnDependencyAnalysis: false
        showEnvVars: false
    scheme:
      # App Store Connectなしでも買い切り購入と復元を確認できる。
      storeKitConfiguration: Yohaku/Resources/Yohaku.storekit
      testTargets:
        - YohakuTests
        - YohakuUITests
      gatherCoverageData: true
  YohakuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - YohakuTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Yohaku
  YohakuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - YohakuUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Yohaku
