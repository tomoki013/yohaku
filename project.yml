name: Yohaku
options:
  bundleIdPrefix: io.tmkch
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "13.7.0"
targets:
  Yohaku:
    type: application
    platform: iOS
    sources:
      - path: Yohaku
        excludes:
          - Resources/Yohaku.storekit
    info:
      path: Yohaku/Info.plist
      properties:
        CFBundleDisplayName: Yohaku
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "3"
        UILaunchScreen:
          UIImageName: LaunchIcon
          UIColorName: LaunchBackground
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        AdMobBannerAdUnitID: $(ADMOB_BANNER_AD_UNIT_ID)
        NSUserTrackingUsageDescription: Advertising permission helps fund Yohaku with more relevant ads. Your spaces are never used for tracking.
        ITSAppUsesNonExemptEncryption: false
        YohakuSiteBaseURL: $(YOHAKU_SITE_BASE_URL)
        YohakuAppStoreID: $(YOHAKU_APP_STORE_ID)
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
